[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch-terminal"
version = "0.1.0"
description = "A local cyberpunk desktop terminal — interface preview"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.7,<7", "psutil>=6,<8", "platformdirs>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
netwatch-terminal = "netwatch_terminal.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
