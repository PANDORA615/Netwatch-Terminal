name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Render application
        run: python -m netwatch_terminal --screenshot docs/terminal-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ runner.os }}
          path: docs/terminal-preview.png
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --windowed --onedir --name NetwatchTerminal src/netwatch_terminal/__main__.py --paths src
      - name: Smoke test packaged executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process dist/NetwatchTerminal/NetwatchTerminal.exe -ArgumentList '--screenshot packaged-smoke.png' -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw 'Executable timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path packaged-smoke.png)) { throw 'Executable smoke test failed' }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            $compiler = Get-ChildItem "${env:ProgramFiles(x86)}/Inno Setup */ISCC.exe" | Select-Object -First 1
          }
          & $compiler.FullName installer/netwatch.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Smoke test installer and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'NetwatchInstallSmoke'
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="' + $destination + '"'
          $setup = Start-Process installer-output/NetwatchTerminal-Setup-x64.exe -ArgumentList $arguments -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installer failed' }
          $installedExe = Join-Path $destination 'NetwatchTerminal.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed executable missing' }
          $app = Start-Process $installedExe -ArgumentList '--screenshot installed-smoke.png' -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Installed executable timed out' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path installed-smoke.png)) { throw 'Installed executable failed' }
          $startup = Get-ItemProperty 'HKCU:/Software/Microsoft/Windows/CurrentVersion/Run' -Name NetwatchTerminal -ErrorAction SilentlyContinue
          if ($startup) { throw 'Autostart must remain disabled by default' }
          $uninstaller = Join-Path $destination 'unins000.exe'
          $uninstall = Start-Process $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed' }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: NetwatchTerminal-Installer-x64
          path: installer-output/NetwatchTerminal-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: NetwatchTerminal-Windows-x64
          path: dist/NetwatchTerminal/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NetwatchTerminal-Windows-x64
          path: portable
      - uses: actions/download-artifact@v4
        with:
          name: NetwatchTerminal-Installer-x64
          path: installer-asset
      - name: Package Windows portable build
        working-directory: portable
        run: zip -r ../NetwatchTerminal-Windows-x64.zip .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" NetwatchTerminal-Windows-x64.zip installer-asset/NetwatchTerminal-Setup-x64.exe
          --verify-tag --title "NETWATCH Terminal $RELEASE_TAG — Windows x64"
          --notes-file docs/RELEASE_NOTES.md --latest
